name: cia_e_lanchonete
services:
  db:
    image: mysql:8.4
    name: db_mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Defina a var DB_DATABASE no .env}
      MYSQL_USER: ${DB_USER:?Defina a var DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina a var DB_PASSWORD no .env}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$SENHA_ROOT_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - db:/var/lib/mysql

  redis:
    image: redis:7
    container_name: db_redis
    restart: always
    expose:
      - "6379"
    command: redis-server --appendonly yes --requirepass ${DB_PASSWORD:?Defina a var DB_PASSWORD no .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  
volumes:
  db:
  redis_data:
      