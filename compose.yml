services:
  db:
    image: mysql:8.0
    container_name: banco
    restart: always
    environment:
      MYSQL_DATABASE: ${BANCO_DB}
      MYSQL_USER: ${USER_DB}
      MYSQL_PASSWORD: ${SENHA_DB}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$SENHA_ROOT_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
  
  backend:
    build: .
    container_name: backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: