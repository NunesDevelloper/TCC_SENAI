name: cia_e_lanchonete
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$SENHA_ROOT_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
      